# =============================================================
# RasPiOS_GadgetMonitor 設定ファイル
# ブートパーティション上にあるため、SDカードをWindowsで開いて編集できます。
# 変更後は Raspberry Pi を再起動してください。
# 書式: KEY=VALUE（行頭 # はコメント）
# =============================================================

# --- USBガジェット ---
# ncm   : 既定。Windows 11 / 10(21H2以降) の標準ドライバで動作
# rndis : NCMが認識されない古いWindows向け
# ecm   : Linux/macOSホスト向け
USB_FUNCTION=ncm

# Pi側 usb0 のIPアドレス（変更時は /etc/dnsmasq.d/usb0.conf も揃えること）
PI_IP=10.87.0.1
PI_PREFIX=24

# --- 表示 ---
# fb  : /dev/fb0 直描画 (既定。カーネルコンソールと同経路で確実に表示される)
# kms : SDL/KMSDRM 直描画 (環境によっては信号に乗らないことがある)
DISPLAY_BACKEND=fb

# Pi自身のSoC温度をヘッダに表示する (1=表示 / 0=非表示)
SHOW_PI_TEMP=1

# --- ブートパーティション経由の更新 ---
# このパーティション(Windowsから見える方)に gadgetmon.py または
# PenchantManufacture.otf を置いておくと、次回起動時にそれぞれ
# /opt/gadgetmon/gadgetmon.py と /opt/gadgetmon/fonts/ へ取り込む。
# SSHが使えない環境でも表示プログラムとフォントを差し替えられる。
# 壊れたファイルは検証で弾かれる。結果は gadgetmon-update.log に記録される。
# 元に戻したいときは空のファイル gadgetmon-rollback を置いて再起動する。
# 0 にすると取り込みを行わない。
BOOT_UPDATE=1

# --- テレメトリ受信 ---
LISTEN_PORT=8787
# この秒数パケットが来なければ SIGNAL LOST 表示
STALE_SEC=5

# --- 警告(警戒色)しきい値。空にするとその項目の警告を無効化 ---
WARN_CPU_UTIL=90
WARN_CPU_TEMP=85
WARN_GPU_TEMP=83
WARN_MEM_PCT=90
WARN_VRAM_PCT=95
WARN_GPU_POWER_W=
WARN_NET_MBPS=
